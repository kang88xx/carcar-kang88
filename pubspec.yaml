name: carcar
description: 가족과 함께 기억하는 우리 차의 자리, 차자리.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.47.9'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: 2.18.3
  shared_preferences: 2.5.5
  flutter_secure_storage: 9.2.4
  image_picker: 1.2.0
  uuid: 4.5.1
  app_links: 6.4.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/brand/google-g.png
  fonts:
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansKR-Bold.ttf
          weight: 700
