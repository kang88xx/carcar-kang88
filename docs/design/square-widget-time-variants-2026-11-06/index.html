<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>차자리 · 4번 위젯 시간 표시 비교</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #1e293b; background: #f5f7fa; font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; }
    main { max-width: 1520px; margin: 0 auto; padding: 48px 32px; }
    h1 { margin: 0 0 12px; font-size: clamp(24px, 3vw, 36px); letter-spacing: -1px; }
    header p { margin: 0; color: #526176; line-height: 1.7; }
    .gallery { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; margin-top: 40px; }
    figure { margin: 0; }
    .gallery a { display: block; border-radius: 24px; overflow: hidden; }
    a:focus-visible { outline: 3px solid #2563eb; outline-offset: 4px; }
    img { display: block; width: 100%; height: auto; aspect-ratio: 1; }
    figcaption { padding: 20px 10px; }
    h2 { margin: 0 0 10px; font-size: 20px; }
    figcaption p { margin: 0; color: #526176; font-size: 14px; line-height: 1.7; }
    .number { display: inline-grid; place-items: center; width: 28px; height: 28px; margin-right: 8px; background: #dbeafe; border-radius: 50%; font-size: 15px; }
    footer { margin-top: 40px; color: #526176; font-size: 13px; line-height: 1.7; }
    footer a { display: inline-block; margin-top: 12px; color: #1e293b; text-underline-offset: 4px; }
    @media (max-width: 1000px) { .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 520px) { main { padding: 32px 20px; } .gallery { grid-template-columns: 1fr; gap: 16px; margin-top: 24px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>4번 위젯 · 시간 표시 비교</h1>
      <p>4번 시안의 위치 표시와 ‘주차 기록’ 버튼을 유지하고, 시간 문구와 배치를 바꿨습니다.<br>‘갱신’ 대신 주차 기록을 저장한 시각을 표시합니다. 이미지를 누르면 원본을 크게 볼 수 있습니다.</p>
    </header>
    <section class="gallery" aria-label="위젯 시간 표시 시안 4개">
      <figure>
        <a href="01-top-caption.png" target="_blank" rel="noopener" aria-label="1번 상단 기록 시각 원본 보기"><img src="01-top-caption.png" alt="위치 표시 위쪽에 기록 시각을 배치한 정사각형 위젯 시안" width="1254" height="1254"></a>
        <figcaption><h2><span class="number">1</span>상단 기록 시각</h2><p>위치 위쪽에 기록 시각을 먼저 보여 줍니다.</p></figcaption>
      </figure>
      <figure>
        <a href="02-location-caption.png" target="_blank" rel="noopener" aria-label="2번 위치 옆 기록 시각 원본 보기"><img src="02-location-caption.png" alt="구역과 번호 가까이에 기록 시각을 배치한 정사각형 위젯 시안" width="1254" height="1254"></a>
        <figcaption><h2><span class="number">2</span>위치 옆 기록 시각</h2><p>구역·번호 가까이에 시간을 묶어 표시합니다.</p></figcaption>
      </figure>
      <figure>
        <a href="03-labeled-row.png" target="_blank" rel="noopener" aria-label="3번 기록 시각 구분 행 원본 보기"><img src="03-labeled-row.png" alt="위치와 주차 기록 버튼 사이에 기록 시각을 별도 행으로 구분한 정사각형 위젯 시안" width="1254" height="1254"></a>
        <figcaption><h2><span class="number">3</span>기록 시각 구분 행</h2><p>위치 아래에 이름과 시각을 나란히 놓습니다.</p></figcaption>
      </figure>
      <figure>
        <a href="04-bottom-caption.png" target="_blank" rel="noopener" aria-label="4번 하단 기록 시각 원본 보기"><img src="04-bottom-caption.png" alt="주차 기록 버튼 아래쪽에 기록 시각을 배치한 정사각형 위젯 시안" width="1254" height="1254"></a>
        <figcaption><h2><span class="number">4</span>하단 기록 시각</h2><p>버튼 아래에 기록 시각을 작게 정리합니다.</p></figcaption>
      </figure>
    </section>
    <footer>디자인 시안 · 위치와 시각은 예시 데이터입니다.<br><a href="../square-widget-concepts-2026-11-06/index.html">이전 시안</a></footer>
  </main>
</body>
</html>
